name: publicar-agendados

# Publica posts agendados do @lendadachampions direto na Graph API. Sem IA, sem PC do usuario.
# Roda a cada 5 min (minutos 2,7,12... pra fugir do pico do :00) e publica o que vence nos proximos ~10 min.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicador
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: publicador
      - name: Publicar itens vencidos
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: bash publicador/publicar.sh
      - name: Salvar estado da fila
        if: always()
        run: |
          if ! git diff --quiet -- publicador/fila-agendada.json; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicador/fila-agendada.json
            git commit -m "publicador: atualiza fila [skip ci]"
            git pull --rebase -q || true
            git push
          fi
